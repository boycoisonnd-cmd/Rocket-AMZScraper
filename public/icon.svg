<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#181B26"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#2B3042" stroke-width="2"/>
  <!-- Rocket Body and Fins -->
  <g transform="translate(18, 14) scale(0.72)" filter="url(#glow)">
    <!-- Exhaust Flame -->
    <path d="M 28 92 C 16 112, 10 124, 18 130 C 26 122, 38 116, 46 102 Z" fill="url(#flameGrad)"/>
    <path d="M 32 94 C 24 108, 20 116, 24 120 C 28 114, 34 110, 41 100 Z" fill="#38BDF8"/>
    <!-- Left Fin -->
    <path d="M 38 82 C 18 80, 8 96, 12 106 C 22 102, 34 94, 42 88 Z" fill="#1E40AF"/>
    <!-- Right Fin -->
    <path d="M 82 48 C 88 28, 106 18, 116 22 C 112 32, 104 44, 98 52 Z" fill="#1E40AF"/>
    <!-- Fuselage -->
    <path d="M 40 88 C 24 64, 46 22, 100 8 C 112 62, 70 104, 40 88 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
    <!-- Nose Cap -->
    <path d="M 82 12 C 90 9, 96 8, 100 8 C 100 12, 99 18, 96 26 Z" fill="#1E40AF"/>
    <!-- Center Porthole -->
    <circle cx="68" cy="40" r="14" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
    <circle cx="64" cy="36" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
